# Excubitor catalog 断片 — GLAB 自身のサービス定義。
# Excubitor が ${ARS_ROOT} 配下を走査して集積する
# (Excubitor/catalog/FRAGMENTS.md 参照)。
#
# GLAB は VGA-GLAB organization のリポジトリで、下記の privileged fields を
# 利用するため、Excubitor 側でこのリポジトリを明示的に信頼する必要がある。
#   EXCUBITOR_ARS_ROOT=<workspace root>
#   EXCUBITOR_TRUSTED_FRAGMENT_REPOS=GLAB
services:
  - code: glab
    name: GLAB (学校運営 hub)
    tier: saas
    project_code: glab
    component: server
    port: 5187
    repo: VGA-GLAB/GLAB-Hub
    runtime: node
    cwd: ${ARS_ROOT}/GLAB
    # npm 経由 (shell) で起動すると Excubitor の breakaway launcher が返す pid は cmd.exe になり、
    # launcher 終了と同時にその cmd.exe だけが消えて「即死」と判定される (実体は生き残り孤児化)。
    # node --run は node 本体が常駐するので pid が実体を指す。--run は prestart を走らせないため
    # ビルドは build_command で起動前に行う。
    # 本番用の start (tsx の watch なし) で起動する。dev の tsx watch は監視の子プロセスを抱えて
    # メモリを余分に食い、AWS 拠点 (1.8GB・スワップ無し) で余裕を削っていた (2026-10-04 neco)。
    # コード変更の反映は Excubitor からの再起動 (build_command → start) で行う。
    command: node --run start
    build_command: npm run build
    allow_hot_reload: false
    # GLAB は Corpus (submodule) を in-process 起動する派生 hub。
    # Corpus プラグインが接続する実依存を起動順へ反映する。
    depends_on: [cernere, cernere-frontend, aedilis, bibliotheca, tirocinium, discutere, voluptas, ostiarius]
    autostart: false
    env:
      CORPUS_PUBLIC_URL: http://localhost:5187
      CORPUS_TOKEN_MODE: cernere-project-token
      GLAB_OMNIPOTENS_REVIEW_ROOT: ${ARS_ROOT}/Omnipotents/Review
      # GLAB 所有のイベント/施設マスタ (plugins/events, plugins/events/facility-store)。
      # server.ts が起動時に必ず要求するため、未設定だと Corpus の listen 前に落ちる。
      # 値は LUDIARS/infra の docker-compose が立てる **localhost 専用の開発 PostgreSQL**
      # (infra/init-databases.sql が glab データベースと glab_user を作る)。 同ファイルは
      # public リポにあり、この資格情報は開発用として既に公開されている = 秘匿対象ではない。
      # ローカル以外へ配置する場合はこの既定を Excubitor Vault 注入で上書きすること。
      GLAB_DATABASE_URL: postgresql://glab_user:glab@localhost:5432/glab
      # Odeum ライブ発表 (plugins/odeum) は任意機能。ODEUM_RELAY_URL は Odeum catalog の
      # odeum-relay が topology で提供し、署名鍵 GLAB_ODEUM_TICKET_PRIVATE_KEY /
      # GLAB_ODEUM_TICKET_KID は Ex Vault から注入する。欠けても hub は起動し odeum だけ無効になる
      # (spec/feature/odeum-live-presentation.md)。required_env には入れない。
      # 認証集約 P4: /external/* が受理する Cernere service token の aud
      # (= Cernere 上の EducationLab の storage_slug)。Cernere の実値と異なるならここを直す。
      # 送り側 (progress → Calliope) は下の cernere_launch_credentials の client credentials を
      # 再利用する。宛先の Calliope は Cernere migration 058 で key=calliope として登録済み。
      GLAB_SERVICE_TOKEN_AUDIENCE: educationlab
      CALLIOPE_PROJECT_KEY: calliope
      # Corpus requireAuth は /api/* にユーザ token を要求するため、ユーザ不在の service 呼び出し
      # (bot の相談通知巡回 → consult、Calliope → projects) が plugin の service 認可に届く前に 401 になっていた。
      # Corpus #2460 の外部経路 opt-in で、これらのモジュールの /api/x/<module>/external/* だけ
      # Cernere service token (aud = CORPUS_CERNERE_STORAGE_SLUG) を service 主体として通す。scope は plugin が照合する。
      CORPUS_EXTERNAL_SERVICE_AUTH_MODULES: consult,projects
      CORPUS_EXTERNAL_SERVICE_TOKEN_HEADERS: x-glab-service-token,x-projecthub-service-token
      CORPUS_CERNERE_STORAGE_SLUG: educationlab
    required_env: [CERNERE_BASE_URL, CERNERE_FRONTEND_URL, CORPUS_PUBLIC_URL, CORPUS_TOKEN_MODE, GLAB_OMNIPOTENS_REVIEW_ROOT, GLAB_DATABASE_URL]
    requires_secret:
      - service: cernere
        keys: [EXCUBITOR_CERNERE_CLIENT_ID, EXCUBITOR_CERNERE_CLIENT_SECRET]
    # Cernere managed project key (Cernere migration 027 の EducationLab)。
    # server.ts の CORPUS_SERVICE_ID 既定値と一致させる。
    cernere_launch_credentials:
      target_project: EducationLab
    health:
      type: tcp
      interval_sec: 30
    provides:
      GLAB_URL: http://${host}:${port}

  # 本社のテスト用 GLAB。本社の Excubitor Vault は AWS の glab の取得元なので、glab の値を本社用に変えると
  # 本番に届く。別の service code にして、Vault のテスト用 project (Cernere の cernere-test と同じ) だけに
  # 紐付ける。接続先 Cernere・DB・起動用資格情報の発行元は全部テスト用
  # (Cernere spec/setup/hq-test-instance.md、neco 2026-10-09)。本社では glab を起動しない。
  - code: glab-test
    name: GLAB (本社テスト用)
    tier: saas
    project_code: glab
    component: server
    port: 5188
    repo: VGA-GLAB/GLAB-Hub
    runtime: node
    cwd: ${ARS_ROOT}/GLAB
    command: node --run start
    build_command: npm run build
    allow_hot_reload: false
    depends_on: [cernere-test, cernere-frontend-test]
    autostart: false
    env:
      GLAB_PORT: "5188"
      CORPUS_PUBLIC_URL: http://localhost:5188
      CORPUS_TOKEN_MODE: cernere-project-token
      GLAB_OMNIPOTENS_REVIEW_ROOT: ${ARS_ROOT}/Omnipotents/Review
      GLAB_SERVICE_TOKEN_AUDIENCE: educationlab
      CALLIOPE_PROJECT_KEY: calliope
      CORPUS_EXTERNAL_SERVICE_AUTH_MODULES: consult,projects
      CORPUS_EXTERNAL_SERVICE_TOKEN_HEADERS: x-glab-service-token,x-projecthub-service-token
      CORPUS_CERNERE_STORAGE_SLUG: educationlab
    required_env: [CERNERE_BASE_URL, CERNERE_FRONTEND_URL, CORPUS_PUBLIC_URL, CORPUS_TOKEN_MODE, GLAB_OMNIPOTENS_REVIEW_ROOT, GLAB_DATABASE_URL]
    requires_secret:
      - service: cernere-test
        keys: [EXCUBITOR_CERNERE_CLIENT_ID, EXCUBITOR_CERNERE_CLIENT_SECRET]
    cernere_launch_credentials:
      target_project: EducationLab
    health:
      type: tcp
      interval_sec: 30

  # GLAB の Discord 通知 bot (bot/)。通知専用で、利用者操作の command は持たない (CLAUDE.md「Discord 入力境界」)。
  # 相談通知の巡回で hub の external API (/api/x/consult/external/*) を呼ぶため、Cernere service token
  # (scope glab-external:write) を自分の client credentials で取得する。hub (EducationLab) と credential を
  # 共有すると起動ごとの再発行で片方が失効するので、bot 専用の Cernere project glab-bot を使う
  # (Cernere migration 059、認証集約 P4。neco 判断 2026-10-05)。
  # Discord token などの secret は従来どおり bot の暗号化 config (@ludiars/encrypted-config) に置く。
  - code: glab-bot
    name: GLAB Discord 通知 bot
    tier: saas
    project_code: glab
    component: worker
    repo: VGA-GLAB/GLAB-Hub
    runtime: node
    cwd: ${ARS_ROOT}/GLAB/bot
    # hub と同じ理由で npm 経由 (shell) にしない (breakaway launcher の pid が cmd.exe を指し即死判定になる)。
    command: node --run start
    allow_hot_reload: false
    depends_on: [glab, cernere]
    autostart: false
    env:
      # hub の external API の到達先 (hub catalog の CORPUS_PUBLIC_URL と同じ)。
      GLAB_BASE_URL: http://localhost:5187
      # hub と共有する GLAB 所有 DB (hub catalog の GLAB_DATABASE_URL と同じ開発用 localhost 値)。
      GLAB_DATABASE_URL: postgresql://glab_user:glab@localhost:5432/glab
    required_env: [CERNERE_BASE_URL, GLAB_BASE_URL]
    cernere_launch_credentials:
      target_project: glab-bot
